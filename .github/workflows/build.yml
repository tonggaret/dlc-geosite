name: Build
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "5 8 * * 1,4" # biweekly
env:
  TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
jobs:
  getFilter:
    # Skip if head commit contains 'skip ci'
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Get Filter
    runs-on: ubuntu-latest
    outputs:
      nodiff: "${{ steps.diff.outputs.flag }}"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Set variables
        run: |
          echo "NOW=$(date +'%F-%H%M')" >> $GITHUB_ENV
          echo "AdGuardSDNSFilter=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdGuardSDNSFilter/AdGuardSDNSFilter_Domain.yaml" >> $GITHUB_ENV
          echo "AdAway=https://raw.githubusercontent.com/deathbybandaid/piholeparser/master/Subscribable-Lists/ParsedBlacklists/AdAway-Default-Blocklist.txt" >> $GITHUB_ENV
          echo "ABPindo=https://raw.githubusercontent.com/ABPindo/indonesianadblockrules/master/subscriptions/domain.txt" >> $GITHUB_ENV
          echo "OneHostsLite=https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.txt" >> $GITHUB_ENV
          echo "HageziProMini=https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.mini-onlydomains.txt" >> $GITHUB_ENV
          echo "PGL=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=domain&showintro=0&mimetype=plaintext" >> $GITHUB_ENV

      - name: Get all domains
        run: |
          curl -sSL $AdGuardSDNSFilter > temp-unsorted
          curl -sSL $AdAway >> temp-unsorted
          curl -sSL $ABPindo >> temp-unsorted
          curl -sSL $OneHostsLite >> temp-unsorted
          curl -sSL $HageziProMini >> temp-unsorted
          curl -sSL $PGL >> temp-unsorted
          #
          sed -i '1d' temp-unsorted
          sed -i "s/[-'+]//g" temp-unsorted
          sed -i 's/   .//g' temp-unsorted
          sed -i 's/payload://g' temp-unsorted
          sed -i '/^#/d;/^$/d' temp-unsorted
      - name: Remove redundant domain
        id: domain
        run: |
          chmod +x ./script/findRedundantDomain.py
          ./script/findRedundantDomain.py ./temp-unsorted ./temp-unsorted-deleted
          [[ ! -f "temp-unsorted-deleted" ]] && touch temp-unsorted-deleted
          sort ./temp-unsorted-deleted > ./temp-sorted-deleted
          diff ./temp-sorted-deleted ./temp-unsorted | awk '/^>/{print $2}' > ./category-ads-all
      - name: Check diff from prev
        id: diff
        run: |
          prev=https://raw.githubusercontent.com/tonggaret/dlc-geosite/subscribe/category-ads-all/category-ads-all
          curl -sSL $prev > ./prev-category-ads-all
          if cmp -s ./category-ads-all ./prev-category-ads-all; then
          echo "No different, set flag nodiff!"
          echo "flag=true" >> $GITHUB_OUTPUT
          else
          echo "Files are different, good to go"
          echo "flag=false" >> $GITHUB_OUTPUT
          fi
      - name: Send Tele
        run: |
          if [ "${{ steps.diff.outputs.flag }}" == "true" ]; then
          MSG="dlc-geosite: No different from last run!"
          curl -X POST \
            -F chat_id=${{ env.TELEGRAM_TO }} \
            -F text="$MSG" \
            "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage"
          else
          COUNT=$(wc -l < ./category-ads-all)
          chmod +x ./script/*.sh
          ./script/tgSendDoc.sh ./category-ads-all "${COUNT}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: category-ads-all
          path: category-ads-all
  convertMrs:
    name: Build mrs for Clash
    runs-on: ubuntu-latest
    needs:
      - getFilter
    if: "!contains(needs.getFilter.outputs.nodiff, 'true')"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: category-ads-all
      - name: Get latest mihomo
        run: |
          download_link="https://github.com/MetaCubeX/mihomo/releases"
          latest_version=$(wget --no-check-certificate -qO- "https://api.github.com/repos/MetaCubeX/mihomo/releases" | grep "tag_name" | busybox grep -oE "v[0-9.]*" | head -1)
          filename="mihomo-linux-amd64-${latest_version}"
          download_link="${download_link}/download/${latest_version}/${filename}.gz"
          echo "[+] ${download_link}"
          curl -LJO $download_link
          gzip -vd "${filename}.gz"
          mv $filename ./mihomo
          chmod 0755 ./mihomo
      - name: Convert Ruleset mrs
        run: |
          ./mihomo convert-ruleset \
            domain text category-ads-all category-ads-all.mrs
      - name: Send Tele
        run: |
          chmod +x ./script/*.sh
          SHA=$(cat category-ads-all.mrs 2>/dev/null | sha256sum | cut -d ' ' -f1)
          ./script/tgSendDoc.sh ./category-ads-all.mrs "${SHA}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: category-ads-all.mrs
          path: category-ads-all.mrs
  buildDat:
    name: Build GeoSite Dat for Clash
    runs-on: ubuntu-latest
    needs:
      - getFilter
    if: "!contains(needs.getFilter.outputs.nodiff, 'true')"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clash/go.mod
          cache: false
      - name: Make data dir
        run: |
          mkdir -p data
          touch cn
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: category-ads-all
          path: ./data/
      - name: Build GeoSite.dat
        run: |
          cd clash || exit 1
          go run -v . --datapath=../data --outputname=GeoSite.dat --outputdir=../ --exportlists=category-ads-all,cn
      - name: Upload artifact GeoSite.dat
        uses: actions/upload-artifact@v4
        with:
          name: GeoSite.dat
          path: GeoSite.dat
      - name: SendTo GeoSite.dat Telegram
        run: |
          chmod +x ./script/tgSendDoc.sh
          SHA=$(cat GeoSite.dat 2>/dev/null | sha256sum | cut -d ' ' -f1)
          ./script/tgSendDoc.sh GeoSite.dat "${SHA}"
  buildDb:
    name: Build GeoSite Db and Rule-set for Sing-box
    runs-on: ubuntu-latest
    needs:
      - getFilter
      - buildDat
    if: "!contains(needs.getFilter.outputs.nodiff, 'true')"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: GeoSite.dat
          path: ./sing-box/
      - name: Build GeoSite.db category-ads-all.srs
        env:
          NO_SKIP: true
        run: |
          cd sing-box || exit 1
          go run -v . GeoSite.dat GeoSite.db rules
          mv GeoSite.db ../
          mv rules/geosite-category-ads-all.srs ../category-ads-all.srs
      - name: Upload artifact GeoSite.db
        uses: actions/upload-artifact@v4
        with:
          name: GeoSite.db
          path: GeoSite.db
      - name: SendTo GeoSite.db Telegram
        run: |
          SHA=$(cat GeoSite.db 2>/dev/null | sha256sum | cut -d ' ' -f1)
          ./script/tgSendDoc.sh GeoSite.db "${SHA}"
      - name: Upload artifact category-ads-all.srs
        uses: actions/upload-artifact@v4
        with:
          name: category-ads-all.srs
          path: category-ads-all.srs
      - name: SendTo category-ads-all.srs Telegram
        run: |
          SHA=$(cat category-ads-all.srs 2>/dev/null | sha256sum | cut -d ' ' -f1)
          ./script/tgSendDoc.sh category-ads-all.srs "${SHA}"
  release:
    permissions: write-all
    name: Release
    runs-on: ubuntu-latest
    needs:
      - getFilter
      - convertMrs
      - buildDat
      - buildDb
    if: "!contains(needs.getFilter.outputs.nodiff, 'true')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make dir "artifact"
        run: mkdir -p artifact
      - name: Download all artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifact/
      - name: Display structure of downloaded files
        run: ls -R
        working-directory: ./artifact/
      - name: Push to "subscribe" branch
        run: |
          branch="subscribe"
          mkdir -p $branch
          cd $branch
          GITPUSH=(git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} "$branch")
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git checkout -b $branch
          _check_branch=$(git ls-remote --heads origin ${branch})
          #
          if [[ -z ${_check_branch} ]]; then
              echo "Branch $branch do not exist" > /dev/null 2>&1
          else
              echo "Branch exist, need sync" > /dev/null 2>&1
              git fetch origin $branch
              git pull origin $branch
              rm -rf ./*
          fi
          NOW=$(date +'%F-%H%M')
          echo -e "# Subscribe dlc\n\n" > README.md
          echo $NOW >> README.md
          cp -r ../artifact/* ./
          git add .
          git commit -asm "Updated on $NOW" && "${GITPUSH[@]}"
